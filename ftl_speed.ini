; FTL Speed plugin settings. Changes apply the next time FTL starts.
; Keep comments on their own lines (Windows ini files have no end-of-line comments).

[keys]
; Key names: PageUp, PageDown, Home, End, Insert, Delete, F1-F24, Num0-Num9,
; NumPlus, NumMinus, NumMultiply, NumDivide, A-Z, 0-9, a hex virtual-key code
; like 0x6B, or none.
; Step up / down through the speeds below:
faster=PageUp
slower=PageDown
; Switch between 1x and the last fast speed:
toggle=Home

[speed]
; Speeds to step through. 1 is always included; values below 1 give slow motion.
steps=1,1.5,2,3,4,6,8

[overlay]
; Speed badge drawn on screen while the game is not at 1x.
show=1
; top-left, top-center, top-right, bottom-left, bottom-center, bottom-right
position=bottom-right
; Size of one font dot in pixels; 0 picks one from the window height.
scale=0

[advanced]
; V-sync caps the frame rate at the monitor refresh rate, and FTL can only run
; about (frame rate / 32) times faster, so V-sync is switched off while sped up
; and restored at 1x.
disable_vsync_when_fast=1
